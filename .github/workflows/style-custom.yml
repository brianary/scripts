# separate terms of service, privacy policy, and support
# documentation.
#
# https://github.com/microsoft/action-psscriptanalyzer
# For more information on PSScriptAnalyzer in general, see
# https://github.com/PowerShell/PSScriptAnalyzer

# updated to establish repo activity that has otherwise been ignored

name: 👓️ PSScriptAnalyzer-CustomRules
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '22 22 * * 4'
permissions:
  contents: read
defaults:
  run:
    shell: pwsh -noninteractive -command ". '{0}'"
jobs:
  build:
    name: 🔬 PSScriptAnalyzer
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out script source
        uses: actions/checkout@v7
      - name: 🧩 Install dependencies
        run: Install-PSResource -TrustRepository -RequiredResourceFile ./test/dependencies.psd1
      - name: 👓️ Run PSScriptAnalyzer Custom Rules
        uses: microsoft/psscriptanalyzer-action@v1.1
        with:
          # Check https://github.com/microsoft/psscriptanalyzer-action for more info about the options.
          # The below set up runs PSScriptAnalyzer to your entire repository and runs some basic security rules.
          path: '.'
          customRulePath: '"test/CustomRules.psd1"'
          recurse: false
          # Include your own basic security rules. Removing this option will run all the rules
          # see https://github.com/PowerShell/PSScriptAnalyzer/tree/master/docs/Rules
          #includeRule: '"PSAvoidGlobalAliases", "PSAvoidUsingConvertToSecureStringWithPlainText"'
          #excludeRule:
          output: custom.sarif
      # Upload the SARIF file generated in the previous step
      - name: 📤️ Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: custom.sarif
